{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login - Sandoval TI</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS próprio -->
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >

</head>

<body class="login-page">


<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-11 col-sm-8 col-md-6 col-lg-4">

            <div class="card login-card shadow">

                <div class="card-body p-4 p-md-5">


                    <!-- LOGO / TÍTULO -->

                    <div class="text-center mb-4">

                        <img
                            src="{% static 'img/logo-sandoval-ti.png' %}"
                            alt="Sandoval TI"
                            class="logo-login mb-3"
                        >

                    </div>


                    <!-- FORMULÁRIO -->

                    <form method="post">

                        {% csrf_token %}


                        {% if form.errors %}

                            <div class="alert alert-danger">
                                <i class="bi bi-exclamation-circle"></i>
                                Usuário ou senha inválidos.
                            </div>

                        {% endif %}


                        
                            <!-- USUÁRIO -->

                            <div class="mb-3">

                                <label
                                    for="id_username"
                                    class="form-label fw-semibold">

                                    Usuário

                                </label>

                                <div class="position-relative">

                                    <i class="bi bi-person"
                                    style="
                                        position: absolute;
                                        left: 14px;
                                        top: 50%;
                                        transform: translateY(-50%);
                                        color: #073179;
                                        z-index: 5;
                                    ">
                                    </i>

                                    <input
                                        type="text"
                                        name="username"
                                        id="id_username"
                                        class="form-control"
                                        placeholder="Digite seu usuário"
                                        autocomplete="username"
                                        required
                                        autofocus
                                        style="padding-left: 42px;"
                                    >

                                </div>

                            </div>                        
                        
                        
                            <!-- SENHA -->

                            <div class="mb-4">

                                <label
                                    for="id_password"
                                    class="form-label fw-semibold">

                                    Senha

                                </label>

                                <div class="position-relative">

                                    <i class="bi bi-lock"
                                    style="
                                        position: absolute;
                                        left: 14px;
                                        top: 50%;
                                        transform: translateY(-50%);
                                        color: #073179;
                                        z-index: 5;
                                    ">
                                    </i>

                                    <input
                                        type="password"
                                        name="password"
                                        id="id_password"
                                        class="form-control"
                                        placeholder="Digite sua senha"
                                        autocomplete="current-password"
                                        required
                                        style="padding-left: 42px; padding-right: 45px;"
                                    >

                                    <button
                                        type="button"
                                        id="togglePassword"
                                        aria-label="Mostrar senha"
                                        title="Mostrar senha"
                                        style="
                                            position: absolute;
                                            right: 8px;
                                            top: 50%;
                                            transform: translateY(-50%);
                                            z-index: 10;
                                            border: none;
                                            background: transparent;
                                            color: #073179;
                                            padding: 5px;
                                        ">

                                        <i class="bi bi-eye" id="eyeIcon"></i>

                                    </button>

                                </div>

                            </div>



                        <!-- BOTÃO -->

                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg">

                                <i class="bi bi-box-arrow-in-right"></i>
                                Entrar

                            </button>

                        </div>


                    </form>


                </div>

            </div>


            <p class="text-center text-muted mt-3 small">
                © 2026 Sandoval TI
            </p>

        </div>

    </div>

</div>

<script>

    const passwordInput = document.getElementById('id_password');
    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePassword.addEventListener('click', function () {

        const senhaVisivel = passwordInput.type === 'text';

        passwordInput.type = senhaVisivel ? 'password' : 'text';

        eyeIcon.classList.toggle('bi-eye', senhaVisivel);
        eyeIcon.classList.toggle('bi-eye-slash', !senhaVisivel);

        togglePassword.setAttribute(
            'aria-label',
            senhaVisivel ? 'Mostrar senha' : 'Ocultar senha'
        );

        togglePassword.title = senhaVisivel ? 'Mostrar senha' : 'Ocultar senha';

    });

</script>

</body>
</html>
